# samples/bluetooth/peripheral_ots_railnet/boards/railnet200_nina_b301_nrf52840.conf
#
# Configuration spécifique au board railnet200_nina_b301 (nRF52840).
# Ce fichier est appliqué EN PLUS de prj.conf quand on compile pour ce board.
#
# RailNet200 hardware notes :
#   - UART0 : connecté à l'iMX6 (/dev/ttymxc7), RTS/CTS NON câblés sur v1.1
#   - UART0 : à vérifier sur v1.3 (schémas dans docs/reference_schemas_railnet200.md)
#   - Debug : SEGGER JLink SWD, RTT pour les logs
#   - BD Address statique souhaitée : DE:CA:F1:5B:AD:00

# Désactiver la console UART (uart0 est utilisé pour SOTP, pas pour les logs)
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=n

# Activer RTT pour les logs de debug
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n

# Fonctionnalités avancées du contrôleur BLE Nordic
CONFIG_BT_CTLR_ADVANCED_FEATURES=y

# Augmenter le buffer RTT pour éviter les "messages dropped" pendant uart_relay
# (le relay UART poll_out est bloquant et noie le buffer RTT par défaut de 512 octets)
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
CONFIG_LOG_BUFFER_SIZE=4096
