# samples/bluetooth/peripheral_ots_railnet/prj.conf
#
# Configuration Kconfig commune à tous les boards.
# Les overrides board-specific sont dans boards/railnet200_nina_b301_nrf52840.conf.
#
# --- Bluetooth ---
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
# Nom affiché lors du scan BLE depuis Android
CONFIG_BT_DEVICE_NAME="RailNet200"

# --- OTS : Object Transfer Service (UUID 0x1825) ---
# Service GATT standardisé, remplaçant BLE d'OBEX.
CONFIG_BT_OTS=y
# Objet directory listing obligatoire selon la spec OTS
CONFIG_BT_OTS_DIR_LIST_OBJ=y
# Nombre maximum d'objets simultanément stockés en RAM
# 4 = 1 dir listing + 3 chunks de données (fichier 64KB découpé en 3 × 30KB)
# RAM : 4 × 32KB = 128KB pool objets + stack BLE ≈ 80% RAM nRF52840
CONFIG_BT_OTS_MAX_OBJ_CNT=4
# Support de l'écriture du nom d'objet (requis par BT_OTS_OACP_CREATE_SUPPORT)
CONFIG_BT_OTS_OBJ_NAME_WRITE_SUPPORT=y
# Support des opérations OACP (Object Action Control Point)
CONFIG_BT_OTS_OACP_WRITE_SUPPORT=y
CONFIG_BT_OTS_OACP_PATCH_SUPPORT=y
CONFIG_BT_OTS_OACP_CREATE_SUPPORT=y
CONFIG_BT_OTS_OACP_DELETE_SUPPORT=y
CONFIG_BT_OTS_OACP_CHECKSUM_SUPPORT=y
# Support de la navigation dans la liste d'objets (OLCP)
CONFIG_BT_OTS_OLCP_GO_TO_SUPPORT=y

# --- UART (relay vers iMX6) ---
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# --- Logs ---
# Les logs sont envoyés via RTT (SEGGER) — voir board conf
CONFIG_LOG=y
CONFIG_ASSERT=y
# Debug L2CAP et OTS pour diagnostiquer le rejet de connexion CoC
CONFIG_BT_L2CAP_LOG_LEVEL_DBG=y
CONFIG_BT_OTS_LOG_LEVEL_DBG=y

# --- L2CAP CoC (requis par OTS pour le transfert de données) ---
CONFIG_BT_L2CAP_DYNAMIC_CHANNEL=y

# --- Stack sizes ---
# OTS utilise une stack BT_RX plus grande (traitement L2CAP CoC)
CONFIG_BT_RX_STACK_SIZE=2048

# --- L2CAP SEG_RECV (réception segment par segment, sans buffer complet SDU) ---
# Avec SEG_RECV, Zephyr appelle seg_recv() pour chaque PDU reçu au lieu de
# reassembler le SDU complet en RAM. Cela permet d'annoncer un rx.mtu grand
# (= taille max objet) sans allouer un buffer de cette taille.
# bt_l2cap_chan_give_credits() est aussi disponible uniquement avec SEG_RECV.
CONFIG_BT_L2CAP_SEG_RECV=y

# --- DLE (Data Length Extension) nRF52840 ---
# nRF52840 supporte DLE jusqu'à 251 bytes de payload LL.
# rx.mps est fixé dans ots_l2cap.c à 245 = DLE_max(251) - L2CAP_HDR(4) - SDU_LEN(2).
# PDU complet (1er PDU du SDU) = 4+2+245 = 251 bytes = 1 LL PDU DLE → pas de fragment.
# Zephyr (l2cap.c:1263) écrase rx.mps si rx.mps > BT_L2CAP_RX_MTU = ACL_RX_SIZE-4.
# ACL_RX_SIZE=255 → BT_L2CAP_RX_MTU=251 ≥ 245 → clamp ne s'applique pas → OK.
# Buffer ACL = 1+4+255 = 260 bytes → tailroom=4 après START(251) → sécurité si CONT.
# rx.mtu = taille max SDU = 32768 (champ déclaratif, pas de buffer de cette taille).
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_BUF_ACL_RX_SIZE=255
CONFIG_BT_OTS_L2CAP_CHAN_RX_MTU=32768
# Buffers extra pour crédits initiaux (8 crédits = 8 PDUs simultanés acceptés).
CONFIG_BT_BUF_ACL_RX_COUNT_EXTRA=8
# Permet à l'application d'initier DLE via bt_conn_le_data_len_update().
# Nécessaire car le contrôleur nRF52840 Zephyr ne négocie pas DLE automatiquement
# (BT_HCI_QUIRKS=0 → bt_drv_quirk_no_auto_dle()=false → auto-update jamais déclenché).
# Sans DLE : PDUs LL = 27 bytes → un PDU L2CAP CoC de 251 bytes = 10 fragments
# → overflow buffer ACL RX (255 bytes) au 10ème fragment.
CONFIG_BT_USER_DATA_LEN_UPDATE=y
